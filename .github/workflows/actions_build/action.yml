
name: ci_build_wheel
inputs:
  os:
    required: true
  python-version:
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Get OS version
      id: get-os-version
      shell: bash -l {0}
      run: |
        if [[ ${{ inputs.os }} == "ubuntu-24.04" ]] || [[ ${{ inputs.os }} == "ubuntu-24.04-arm" ]]; then
            varOS=`cat /etc/os-release | grep "VERSION=" | grep -oP '(?<=\").*?(?=\")'`
            varOS=($varOS)
            varOS=${varOS[0]}
            if [[ ${{ inputs.os }} == "ubuntu-24.04-arm" ]]; then
                varOS="${varOS}-arm"
            else
                varOS="${varOS}-intel"
            fi
            echo "release=${varOS}" >> $GITHUB_OUTPUT
        elif [[ ${{ inputs.os }} == "macos-15" ]] || [[ ${{ inputs.os }} == "macos-15-intel" ]]; then
            varOS=$(sw_vers -productVersion)
            if [[ ${{ inputs.os }} == "macos-15-intel" ]]; then
                varOS="${varOS}-intel"
            else
                varOS="${varOS}-m1"
            fi
            echo "release=${varOS}" >> $GITHUB_OUTPUT
        else
            varOS=`windows`
            if [[ ${{ inputs.os }} == "windows-2025" ]]; then
                varOS="${varOS}-intel"
            else
                varOS="${varOS}-arm"
            fi
            echo "release=${varOS}" >> $GITHUB_OUTPUT
        fi
    # installed Geant4 and ITK (macOS, Windows), built by the build scripts on a
    # cache miss. Linux: Geant4 and ITK are in the docker image, no cache
    - name: Cache modules
      if: (inputs.os != 'ubuntu-24.04') && (inputs.os != 'ubuntu-24.04-arm')
      id: cache_opengate_core_dependencies
      uses: actions/cache@v5
      with:
        path: ~/software/install
        key: ${{ runner.os }}-${{ steps.get-os-version.outputs.release }}_geant4_${{ env.GEANT4_VERSION }}_itk_${{ env.ITK_VERSION }}_install1
        restore-keys: ${{ runner.os }}-${{ steps.get-os-version.outputs.release }}_geant4_${{ env.GEANT4_VERSION }}_itk_${{ env.ITK_VERSION }}_install1
    # compiler cache (ccache) of opengate_core, macOS, Linux x86 and Windows
    # x86: saved by the master runs only, for the Python versions built by
    # the pull requests (3.10, 3.14), one entry per OS and Python (the older one
    # is deleted), so that it does not fill the Actions cache (~0.1 GB macOS,
    # ~0.36 GB Linux, ~1.15 GB Windows per entry); restored by all the runs
    - name: Restore the compiler cache
      if: (inputs.os == 'macos-15' || inputs.os == 'ubuntu-24.04' || inputs.os == 'windows-2025')
      uses: actions/cache/restore@v5
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.os }}-${{ inputs.python-version }}-${{ env.GEANT4_VERSION }}-${{ github.run_id }}
        restore-keys: ccache-${{ inputs.os }}-${{ inputs.python-version }}-${{ env.GEANT4_VERSION }}-
    - name: Miniconda setup Macos and windows
      if: (inputs.os == 'macos-15')|| (inputs.os == 'macos-15-intel') || (inputs.os == 'windows-2025') || (inputs.os == 'windows-11-arm')
      uses: conda-incubator/setup-miniconda@v4
      with:
          miniconda-version: "latest"
          auto-update-conda: true
          activate-environment: opengate_core
          python-version: '3.13'
    - name: Set up Homebrew
      if: (inputs.os == 'macos-15')
      id: set-up-homebrew-mac
      uses: Homebrew/actions/setup-homebrew@main
    - name: Create opengate_core Wheel Linux
      if: (inputs.os == 'ubuntu-24.04') || (inputs.os == 'ubuntu-24.04-arm')
      env:
        MATRIX_OS: ${{ inputs.os }}
        MATRIX_PYTHON_VERSION: ${{ inputs.python-version }}
      shell: bash -l {0}
      run: |
          export > $GITHUB_WORKSPACE/env_dump.txt
          bash $GITHUB_WORKSPACE/.github/workflows/actions_build/ci_build_wheel_ubuntu.sh
    - name: Create opengate_core Wheel Mac
      if: (inputs.os == 'macos-15') || (inputs.os == 'macos-15-intel')
      env:
        MATRIX_OS: ${{ inputs.os }}
        MATRIX_PYTHON_VERSION: ${{ inputs.python-version }}
        MATRIX_CACHE: ${{ steps.cache_opengate_core_dependencies.outputs.cache-hit }}
      shell: bash -l {0}
      run: |
          export > $GITHUB_WORKSPACE/env_dump.txt
          bash $GITHUB_WORKSPACE/.github/workflows/actions_build/ci_build_wheel_macos.sh
    # Windows: opengate_core is compiled with Ninja (MSBuild does not support
    # ccache): it needs the MSVC environment (cl.exe, link.exe) in the PATH
    - name: MSVC environment Windows
      if: (inputs.os == 'windows-2025')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Create opengate_core Wheel Windows
      if: (inputs.os == 'windows-2025') || (inputs.os == 'windows-11-arm')
      env:
        MATRIX_CACHE: ${{ steps.cache_opengate_core_dependencies.outputs.cache-hit }}
        MATRIX_PYTHON_VERSION: ${{ inputs.python-version }}
        MATRIX_OS: ${{ inputs.os }}
      shell: bash -l {0}
      run: |
          export > $GITHUB_WORKSPACE\\env_dump.txt
          bash $GITHUB_WORKSPACE\\.github\\workflows\\actions_build\\ci_build_wheel_windows.sh
    - name: Save the compiler cache
      if: (inputs.os == 'macos-15' || inputs.os == 'ubuntu-24.04' || inputs.os == 'windows-2025') && (inputs.python-version == '3.10' || inputs.python-version == '3.14') && github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v5
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.os }}-${{ inputs.python-version }}-${{ env.GEANT4_VERSION }}-${{ github.run_id }}
    - name: Delete the older compiler caches
      if: (inputs.os == 'macos-15' || inputs.os == 'ubuntu-24.04' || inputs.os == 'windows-2025') && (inputs.python-version == '3.10' || inputs.python-version == '3.14') && github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        PREFIX: ccache-${{ inputs.os }}-${{ inputs.python-version }}-${{ env.GEANT4_VERSION }}-
        KEEP: ccache-${{ inputs.os }}-${{ inputs.python-version }}-${{ env.GEANT4_VERSION }}-${{ github.run_id }}
      # a failed clean-up must not fail the build
      continue-on-error: true
      shell: bash -l {0}
      run: |
          # Windows: SSL_CERT_FILE of the conda environment breaks the TLS of gh
          unset SSL_CERT_FILE SSL_CERT_DIR
          gh cache list --repo ${{ github.repository }} --ref ${{ github.ref }} --key "$PREFIX" --limit 100 --json key --jq '.[].key' |
            while read -r key; do
              [[ "$key" == "$KEEP" ]] || gh cache delete --repo ${{ github.repository }} "$key" || true
            done
