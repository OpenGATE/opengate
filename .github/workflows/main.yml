name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches: [ master, gateRTionv2_rc ]
    tags:
      - '*'
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches: [ master, gateRTionv2_rc ]
  schedule:
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GEANT4_VERSION: 'v11.4.0'
  ITK_VERSION: 'v5.4.4'

jobs:
  build_opengate_wheel:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.10']
    steps:
    - name: Checkout github repo
      uses: actions/checkout@v6
    - name: Checkout submodules
      shell: bash -l {0}
      run: |
        export GIT_SSL_NO_VERIFY=1
        git submodule update --init --recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: 'x64'
    - name: Create opengate Wheel
      run: |
          rm -rf $GITHUB_WORKSPACE/opengate/tests/data
          cp $GITHUB_WORKSPACE/.git/modules/gam-tests/data/HEAD $GITHUB_WORKSPACE/opengate/tests/
          pip install build
          python -m build
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: dist-opengate
        path: dist/

  build_opengate_core_wheel_pr:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-15
            python-version: '3.10'
          - os: windows-2025
            python-version: '3.10'
    steps:
    - name: Checkout github repo
      uses: actions/checkout@v6
    - name: Checkout submodules
      shell: bash -l {0}
      run: |
        if [[ ${{ matrix.os }} == "windows-2025" ]]; then
          set "GIT_SSL_NO_VERIFY=1"
        else
          export GIT_SSL_NO_VERIFY=1
        fi
        git submodule update --init --recursive
    - uses: ./.github/workflows/actions_build
      with:
        os: ${{ matrix.os }}
        python-version: ${{ matrix.python-version }}
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python-version }}-opengate-core
        path: dist/

  build_opengate_core_wheel_ci_or_tag:
    if: (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')) || (github.event_name == 'schedule')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15-intel]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-15
            python-version: '3.10'
          - os: windows-2025
            python-version: '3.10'
          - os: macos-15-intel
            python-version: '3.14'
    steps:
    - name: Checkout github repo
      uses: actions/checkout@v6
    - name: Checkout submodules
      shell: bash -l {0}
      run: |
        if [[ ${{ matrix.os }} == "windows-11-arm" ]]; then
          set "GIT_SSL_NO_VERIFY=1"
        else
          export GIT_SSL_NO_VERIFY=1
        fi
        git submodule update --init --recursive
    - uses: ./.github/workflows/actions_build
      with:
        os: ${{ matrix.os }}
        python-version: ${{ matrix.python-version }}
    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python-version }}-opengate-core-ci_or_tag
        path: dist/

  publish_wheel:
    runs-on: ubuntu-24.04
    needs: [build_opengate_wheel, build_opengate_core_wheel_pr, build_opengate_core_wheel_ci_or_tag]
    steps:
    - name: Checkout github repo
      uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist/
    - name: Separate the wheels
      run: |
          mkdir dist_opengate_core dist_opengate
          mv dist/opengate_core_rtion* dist_opengate_core/
          mv dist/opengate_rtion* dist_opengate/
    - name: Publish to PyPI opengate_core
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_OPENGATE_CORE_RTION }}
        packages-dir: dist_opengate_core/
        skip-existing: true
    - name: Publish to PyPI opengate
      if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_OPENGATE_RTION }}
        packages-dir: dist_opengate/
        skip-existing: true

